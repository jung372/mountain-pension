name: Update Onbid Data
on:
  schedule:
    - cron: '0 19 * * *' # 매일 한국시간 오전 4시 실행 (UTC 19:00 = KST 04:00)
  workflow_dispatch: # 수동 실행 버튼 추가

permissions:
  contents: write  # 저장소에 push 권한 부여

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 인증 토큰으로 체크아웃
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests pandas openpyxl
      - name: Run update script
        env:
          ONBID_AUTH_KEY: ${{ secrets.ONBID_AUTH_KEY }}
        run: python fetch_onbid.py
      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add onbid_data.js
          git commit -m "Auto-update onbid data" || exit 0
          git pull --rebase origin main
          git push
