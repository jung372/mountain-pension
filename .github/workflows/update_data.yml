name: Update Onbid Data
on:
  workflow_dispatch: # 웹사이트 새로고침 버튼 및 Actions 화면의 수동 실행

permissions:
  contents: write  # 저장소에 push 권한 부여

concurrency:
  group: onbid-data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 인증 토큰으로 체크아웃
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run update script
        env:
          ONBID_AUTH_KEY: ${{ secrets.ONBID_AUTH_KEY }}
        run: python collector.py
      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ onbid_data.js
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
            exit 0
          fi
          git commit -m "chore: 수동 데이터 갱신 $(date +'%Y-%m-%d') [skip ci]"
          git pull --rebase origin main
          git push
